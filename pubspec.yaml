name: namaztime
description: "Namaz Time — Prayer times reminder app with Qibla compass."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI & Fonts
  google_fonts: ^6.2.1

  # Localization
  easy_localization: ^3.0.7

  # HTTP
  dio: ^5.7.0

  # Local storage
  hive_flutter: ^1.1.0

  # Location
  geolocator: ^13.0.1

  # Compass
  flutter_compass: ^0.8.0

  # Local notifications
  flutter_local_notifications: ^21.0.0
  file_picker: ^8.1.2
  workmanager: ^0.6.0

  # Permissions
  permission_handler: ^11.3.1

  # State management
  provider: ^6.1.2

  # Timezone for notifications
  timezone: ^0.11.0

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
